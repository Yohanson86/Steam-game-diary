name: Steam Library and Diary APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-fix XML and multiline string
        run: |
          python3 - << 'EOF'
          import pathlib
          p_xml = pathlib.Path("app/src/main/res/xml/backup_rules.xml")
          if p_xml.exists():
              p_xml.write_text(p_xml.read_text().replace('domain=" database"', 'domain="database"'))
          p_kt = pathlib.Path("app/src/main/java/com/gamediary/steam/MainActivity.kt")
          if p_kt.exists():
              txt = p_kt.read_text()
              txt = txt.replace("включен.\n✓ Последняя", "включен.\\n✓ Последняя")
              if "@file:OptIn" not in txt:
                  txt = "@file:OptIn(ExperimentalMaterial3Api::class)\n" + txt
              p_kt.write_text(txt)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: SteamGameDiary-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
